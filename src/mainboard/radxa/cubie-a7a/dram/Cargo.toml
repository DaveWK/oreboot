[package]
name = "cubie-a7a-dram"
version = "0.1.0"
authors = ["oreboot authors"]
edition = "2021"
description = "LPDDR5 DRAM init for the Allwinner A733 (Radxa Cubie A7A), without the vendor library"

[dependencies]
dram-train = { path = "../../../../lib/dram-train" }
jedec-lpddr = { path = "../../../../lib/jedec-lpddr" }
dram-ctrl = { path = "../../../../lib/dram-ctrl" }
dwc-ddrctl = { path = "../../../../lib/dwc-ddrctl" }
memtest = { path = "../../../../lib/memtest" }

[features]
# The blob-free boot's settings (profile.rs) as the value of every A7A_*
# knob the build's environment leaves unset, and its VDD2L; build variable
# A7A_PROFILE picks the DRAM clock (bt0's default feature `blobfree`). Off:
# every knob from the build's environment alone, as the lab images are
# built, and the crate compiles as it did before the profiles existed.
boot-profile = []
# VDD2L (ELDO1) at the vendor library's 1080 mV instead of 900 mV (power.rs).
vendor-vdd2l = []
# Runtime overrides of the lab knobs (knobs::get, knobs::env, knobs::set;
# bt0 feature dram-lab). Off: knobs::get and knobs::env return the build
# values, so the knob functions fold to constants and images stay the size
# the build-time consts gave.
lab-knobs = []
# Compatibility alias: the live rank decoder is always available.
rank-map = []
# drift: one sample of the DRAM's WCK2DQ interval oscillators, MR4 and the
# PHY's drift indicators in mission mode, for logging; no compensation (bt0
# feature drift-log; always built for the unit tests). Off: the crate
# compiles exactly as before, so the other images stay byte-identical.
drift-log = []
# The full-speed lab stages of the blob-free flow, each still selected by
# its own build knob: the WCK duty-cycle stage after the read training
# (dca, A7A_DCA) and through the controller (dcactl, A7A_DCA_CTL), the
# two-dimensional read eye (rdeye, A7A_RD_VREF=eye) and the command-bus
# reference step of command bus training (blobless::cavref, A7A_CA_VREF)
# (bt0 feature full-speed; always built for the unit tests). Off: the
# crate compiles exactly as before, so the other images stay
# byte-identical.
full-speed = []
# Vendor-trained reference delays (rd::VENDOR_RX_EN, rd::VENDOR_CLK) for
# lab comparison output only (bt0 features rd-measure and rd-train-only).
vendor-rd-ref = []
