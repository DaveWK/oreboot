[package]
name = "oreboot-cubie-a7a-bt0"
version = "0.1.0"
authors = ["oreboot authors"]
edition = "2021"

[features]
# The default build is the blob-free boot. Every other DRAM backend and
# every lab feature is built with --no-default-features, and then means
# what it meant before the default existed.
default = ["blobfree"]
# The blob-free boot: this board's own driver (crate cubie-a7a-dram) with
# no vendor library, no PHY training firmware and no PIE image built in,
# loaded or run, and with the settings of its board runs built in
# (cubie_a7a_dram::knobs::profile), so the build needs nothing from outside
# this tree and no A7A_* knob. It trains, checks its writes and goes on to
# load main and the payload; a stage that fails halts. With `fel`, `spinor`,
# `fastboot`, `otp`, `wr-r1`; not with another backend or a lab feature.
#
# Build variable A7A_PROFILE picks the profile by its DRAM clock: 1200 (WCK
# 1200 MHz, 2400 Mb/s per pin) or 2400 (4800 Mb/s per pin; it does not boot
# Linux yet); unset: cubie_a7a_dram::knobs::profile::DEFAULT. An A7A_* knob
# in the build's environment overrides the profile's value, `A7A_X=-`
# unsets one, and A7A_PROFILE=none builds with no profile at all (the
# knobs alone: the image `bl-mission` builds).
blobfree = ["cubie-a7a-dram/boot-profile"]
# DRAM init through Allwinner's closed library (A733_DRAM_LIB) instead of
# this board's driver: the comparison path. The library is not part of this
# tree; see the board README.
dramlib = []
# Lab: DRAM without any PHY firmware, every setting an A7A_* knob of the
# build's environment and none built in. On its own it runs the stages up
# to the read training and halts (src/dram/blobless.rs); `bl-mission` adds
# the rest of the boot path.
#
# With --no-default-features and none of `dramlib`, `blobless` and their
# dependents: the driver with the PHY's own training firmware and PIE
# images, which run inside the PHY, loaded as data (A733_PHY_FW_OBJ, see
# the board README; no vendor code is linked). The base of `hybrid`.
blobless = []
# One held-reset alias observation; bypass all ACSM/DevInit/CBT probes.
wck-alias-probe = ["blobless"]
# Measurement build: the vendor library trains, bt0 prints the trained
# per-DBYTE/lane PHY delays (read-only, named CSRs) and halts. Comparison
# data only; never shipped.
av3-dump = ["dramlib"]
# As av3-dump (the library's normal run), then the PHY's mission state by
# address range (crate `dump`) instead of the per-CSR dump, for the
# host-side diff against the hand-over image's dump.
av3h = ["av3-dump"]
# As av3-dump, with the vendor library training one pstate at
# 1200 MHz (our blobless probe's pstate 1 frequency): dram_clk 1200 and
# tpr13[2] (multi-pstate) cleared. The dump then reads that pstate.
av3c = ["av3-dump"]
# As av3c, plus our data-mode compare in the vendor library's trained state
# (positive control), the PHY taking the DFI after a controller quiesce;
# then the halt. This is the eye image.
av3g = ["av3c"]
# The gate image of av3g: the gate window and the four-pattern data check
# instead of the per-lane eye.
av3g-gate = ["av3g"]
# Arm the PMIC's die over-temperature power-off at 115 C and print the
# read-back. Off by default.
otp = []
# The per-call-site udelay trace of the vendor DRAM library on the console
# (~27 lines at 115200 baud, ~150-230 ms of a boot). Off by default; the
# last site still goes to the RTC registers for the post-reset report.
dram-trace = []
# The read path measurement searches (rd::measure_block) instead of the
# read training (rdtrain).
rd-measure = ["blobless"]
# The read training as a measurement image: it runs, checks and puts
# everything back (the initial state repeated), with the vendor's trained
# values as references. Without it the training is applied.
rd-train-only = ["blobless"]
# The hand-over to the DDR controller without a PIE after the applied read
# training (crate module handover; measurement image).
handover = ["blobless"]
# Lab: the code of the blob-free boot with no settings built in. After the
# applied read training, the lean hand-over
# (cubie_a7a_dram::blobless::mission_handover: mission CSRs, read-data
# enable, CPU-answered DFI init, ports) and the write stage (A7A_WR_STAGE),
# then the halt (back to FEL in a FEL build) for the host's checks, or
# with A7A_BL_BOOT the rest of the boot.
bl-mission = ["blobless"]
# Hybrid: the open backend with the PHY training firmware for the pstate,
# then our own stages (WCK2CK leveling, read training) and the lean
# hand-over (bt0/src/dram/blobless.rs hybrid_after_pmu). Build with
# A7A_OPEN_OPTS bit 7 (stop before the DFI init).
hybrid = []
# USB FEL boot (src/fel.rs; scripts/fel-boot.sh in radxa-a7a-workspace):
# bt0 linked at 0x90000, started by the mask ROM's FEL (xfel exec) instead
# of from the SD card. Entry 1 brings up PMIC, clocks and DRAM and returns
# to FEL; the host then writes main, the payload and the layout table;
# entry 2 checks them and hands over to main as the SD path does. With any
# DRAM backend.
fel = ["cubie-a7a-dram/vendor-vdd2l"]
# SPI NOR boot (src/spinor.rs): the mask ROM loads bt0 from NOR offset 0;
# bt0 reads the layout table and the images from the NOR at the SD card's
# offsets. Same DRAM rails as the FEL boot that runs on the board; with any
# DRAM backend. Excludes `fel`.
spinor = ["cubie-a7a-dram/vendor-vdd2l"]
# Boot from the eMMC module (SMHC2): the mask ROM loads bt0 from the eMMC,
# bt0 reads the layout table and images from its user area. Every build
# without `fel` and `spinor` does that already (it boots the SD card or the
# eMMC, whichever the mask ROM loaded it from); the feature only keeps the
# FEL boot's VDD2L for the backends that do not set it themselves (the
# blob-free boot's profile does).
emmc = ["cubie-a7a-dram/vendor-vdd2l"]
# fastboot over FEL (src/fastboot.rs, src/musb.rs; scripts/fastboot-boot.sh
# in radxa-a7a-workspace): FEL entry 4 at 0x9004c brings DRAM up (unless
# entry 1 did), takes USB0 over from the mask ROM and serves the stock
# fastboot tool (18d1:4ee0): getvar, download, boot/continue of a layout
# bundle (the FEL entry 2 hand-over), reboot, reboot-bootloader (back to
# FEL), oem log/read32/fel, and read-only dumps with `fastboot fetch`: the
# SPI NOR (READ/RDID/RDSR only), the USB disk on the blue port (EHCI1,
# Bulk-Only, SCSI reads only), the SD card (identification and reads
# only). No NOR erase/program code is built in.
fastboot = ["fel"]
# fastboot flash/erase of the SPI NOR partitions (bt0, layout, main, edk2)
# behind cubie_a7a_fastboot::nor's guards (oem nor-arm with the image's
# length and CRC-32, JEDEC ID, no protection bits, erase/program/read-back
# inside the partition, never at or above 0x700000). Bench builds only.
fastboot-nor-write = ["fastboot"]
# DRAM lab mode over fastboot (src/labfb.rs): FEL
# entry 4 brings up clocks, UART and PMIC but not DRAM; `oem dram-run
# <A7A_* knobs>` then runs the DRAM init once per session with runtime
# knobs (cubie_a7a_dram::knobs), the results stay in SRAM (run log, lab
# op output, PHY CSR and controller register dumps) for `getvar`, `oem`
# and `fetch`; `reboot` ends every run. Combine with the open driver and
# `hybrid` or `bl-mission` (no settings are built in: the knobs are the
# run's).
dram-lab = ["fastboot", "cubie-a7a-dram/lab-knobs", "cubie-a7a-common/sram-log"]
# eMMC flash/erase and the boot configuration (PARTITION_CONFIG bits 6:3,
# BOOT_BUS_CONDITIONS) behind arming and content checks.
fastboot-emmc-write = ["fastboot"]
# The write stage's upper eight probe blocks in rank 1 instead of at
# 0xbf000000 (src/dram/wrstage.rs `blocks`; with the blob-free boot, or
# with `bl-mission` or `hybrid` and `A7A_WR_STAGE`): rank 1 is found from
# the address map the controller
# holds (CXMT 4 GB: 0xc0100000; CXMT 6 GB, non-binary: 0x80100000), so the
# stage's compares cover both ranks. Lab feature until a board run confirms
# the rank layout; without it every image is built as before.
wr-r1 = ["cubie-a7a-dram/rank-map"]
# Lab op DRIFT of the FEL lab entry (src/lab.rs; cubie_a7a_dram::drift): one
# drift sample of a channel in mission mode. It runs the DRAM's WCK2DQI and
# WCK2DQO interval oscillators through the controller's sequencer and
# returns their counts, MR4 and the PHY's drift indicators; it compensates
# nothing. Lab builds only; without it every image is built as before.
drift-log = ["fel", "cubie-a7a-dram/drift-log"]
# The blobless probe at pstate 3 (the lowest) instead of 1, the
# timing-independence test of the data-mode compare.
probe-ps3 = ["blobless"]
[dependencies]
bootlog = { path = "../../../../lib/bootlog" }
log = { path = "../../../../lib/log" }
util = { path = "../../../../lib/util" }
cubie-a7a-common = { path = "../common" }
cubie-a7a-dram = { path = "../dram" }
# Protocol, guards and the read-only allow-lists (smhc.rs uses the SD one
# in every build).
cubie-a7a-fastboot = { path = "../fastboot" }

[build-dependencies]
sha256 = { path = "../../../../lib/sha256" }
