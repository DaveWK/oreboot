[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
rustflags = [
  "-C",
  "link-arg=-Tlink-cubie-a7a-main.ld",
  "-C",
  "link-arg=--gc-sections",
  # EL3 runs with the MMU off, so all memory is Device-nGnRnE: no unaligned
  # accesses allowed.
  "-C",
  "target-feature=+strict-align",
]

# The prebuilt core/compiler_builtins are not built with +strict-align and
# may emit unaligned accesses; rebuild them with the flags above.
[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
