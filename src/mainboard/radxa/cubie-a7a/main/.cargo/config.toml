[build]
# EL3 runs with the MMU off, so all memory is Device-nGnRnE: no unaligned
# accesses allowed. The built-in target spec enables +strict-align (see
# `rustc -Z unstable-options --print target-spec-json --target aarch64-unknown-none-softfloat`).
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
rustflags = [
  "-C",
  "link-arg=-Tlink-cubie-a7a-main.ld",
  "-C",
  "link-arg=--gc-sections",
]

# Rebuild core and compiler_builtins for the same strict-alignment target.
[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
